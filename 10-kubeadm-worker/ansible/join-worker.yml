---
# Join Rocky bootc worker nodes to an existing kubeadm cluster.
# One-time per node; credentials then persist in /var across upgrades.
#   ansible-playbook -i inventory.ini join-worker.yml

- name: Mint a fresh join command on a control-plane node
  hosts: control_plane[0]
  become: true
  gather_facts: false
  tasks:
    - name: Create bootstrap token and print the join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false

    - name: Publish the join command for the worker play
      ansible.builtin.set_fact:
        join_command: "{{ kubeadm_join_command.stdout }}"

- name: Join worker nodes
  hosts: workers
  become: true
  gather_facts: false
  vars:
    join_command: "{{ hostvars[groups['control_plane'][0]]['join_command'] }}"
  tasks:
    - name: Detect whether this node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Run kubeadm join (skipped if already a member)
      ansible.builtin.command: "{{ join_command }}"
      when: not kubelet_conf.stat.exists
      register: join_result
      changed_when: "'This node has joined the cluster' in join_result.stdout"

    - name: Ensure kubelet is enabled and running
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started
