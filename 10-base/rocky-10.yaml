releasever: 10

repos:
  - baseos
  - appstream

variables:
  distro: "rocky10"

packages:
  - rocky-repos

exclude-packages:
  # UKI kernel packages: their %posttrans runs a kernel-install wrapper that
  # isn't present during rpm-ostree compose, which breaks build-rootfs on
  # x86_64. Upstream centos-stream excludes these; we carry it here since we
  # don't include that layer.
  - kernel-debug-uki-virt
  - kernel-uki-virt

postprocess:
  - |
    #!/usr/bin/env bash

    set -euo pipefail

    mkdir -p /usr/lib/bootc/install/
    cat > /usr/lib/bootc/install/20-rocky.toml << EOF
    [install]
    root-fs-type = "xfs"
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    dnf clean all
    rm /var/{log,cache,lib}/* -rf
    systemctl preset-all

include:
  - standard/manifest.yaml
