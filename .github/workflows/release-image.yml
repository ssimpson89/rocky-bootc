name: release-image

# Build the Rocky bootc image when a GitHub Release is published, and push it
# to the container registry as a multi-arch (amd64 + arm64) image. The release
# tag becomes the image tag.
on:
  release:
    types: [published]

# Nothing here is hardcoded:
#   REGISTRY    - repo/org Actions *variable* (Settings -> Secrets and variables
#                 -> Actions -> Variables). Defaults to ghcr.io if unset.
#   IMAGE_NAME  - derived from the repo (owner/name), so forks/renames just work.
env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build each architecture natively (no emulation) and push an arch-specific
  # tag. Native arm64 avoids qemu, which the nested rpm-ostree compose does not
  # tolerate well.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Makefile builds and rechunks with `sudo podman`, so the image lives
      # in root's storage. Log in, tag, and push as root too, or the image is
      # "not known" to the rootless podman.
      - name: Log in to the container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and rechunk (${{ matrix.arch }})
        run: |
          make image   PLATFORM=${{ matrix.platform }}
          make rechunk PLATFORM=${{ matrix.platform }}

      - name: Push arch-specific tag
        run: |
          # Registry paths must be lowercase; owner/name may contain uppercase.
          IMAGE="${REGISTRY,,}/${IMAGE_NAME,,}"
          TAG="${{ github.event.release.tag_name }}"
          sudo podman tag rocky-bootc:latest "$IMAGE:$TAG-${{ matrix.arch }}"
          sudo podman push "$IMAGE:$TAG-${{ matrix.arch }}"

  # Stitch the per-arch images into a single multi-arch manifest list, so that
  # `bootc upgrade` on either architecture pulls the right image from one tag.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Assemble and push multi-arch tags
        run: |
          IMAGE="${REGISTRY,,}/${IMAGE_NAME,,}"
          TAG="${{ github.event.release.tag_name }}"
          for target in "$TAG" latest; do
            podman manifest create "$IMAGE:$target" \
              "docker://$IMAGE:$TAG-amd64" \
              "docker://$IMAGE:$TAG-arm64"
            podman manifest push --all "$IMAGE:$target" "docker://$IMAGE:$target"
            podman manifest rm "$IMAGE:$target"
          done

  # Mirror the released image into a local/private registry via a self-hosted
  # runner on your LAN. Disabled until you opt in:
  #   1. Register a self-hosted runner (Settings -> Actions -> Runners) with
  #      skopeo installed.
  #   2. Set variable  ENABLE_LOCAL_MIRROR = true
  #   3. Set variable  LOCAL_REGISTRY      = registry host[:port]
  #   4. Set secrets   LOCAL_REGISTRY_USER / LOCAL_REGISTRY_PASSWORD
  #   5. If the local registry uses a private CA / no TLS, adjust the tls flags.
  # mirror-to-local:
