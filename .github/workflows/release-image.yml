name: release-image

# Build the Rocky bootc image when a GitHub Release is published, and push it
# to the container registry. The release tag becomes the image tag.
on:
  release:
    types: [published]

# Nothing here is hardcoded:
#   REGISTRY    - repo/org Actions *variable* (Settings -> Secrets and variables
#                 -> Actions -> Variables). Defaults to ghcr.io if unset.
#   IMAGE_NAME  - derived from the repo (owner/name), so forks/renames just work.
env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registry paths must be lowercase; owner/name may contain uppercase.
      - name: Compute image reference
        id: image
        run: echo "ref=${REGISTRY,,}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and rechunk
        run: |
          make image
          make rechunk

      - name: Tag and push
        run: |
          IMAGE="${{ steps.image.outputs.ref }}"
          TAG="${{ github.event.release.tag_name }}"
          podman tag rocky-bootc:latest "$IMAGE:$TAG"
          podman tag rocky-bootc:latest "$IMAGE:latest"
          podman push "$IMAGE:$TAG"
          podman push "$IMAGE:latest"

  # Mirror the released image into a local/private registry via a self-hosted
  # runner on your LAN. Disabled until you opt in:
  #   1. Register a self-hosted runner (Settings -> Actions -> Runners) with
  #      skopeo installed.
  #   2. Set variable  ENABLE_LOCAL_MIRROR = true
  #   3. Set variable  LOCAL_REGISTRY      = registry host[:port]
  #   4. Set secrets   LOCAL_REGISTRY_USER / LOCAL_REGISTRY_PASSWORD
  #   5. If the local registry uses a private CA / no TLS, adjust the tls flags.
  mirror-to-local:
    needs: build
    if: ${{ vars.ENABLE_LOCAL_MIRROR == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Log in to the source registry (ghcr)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | skopeo login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in to the local registry
        run: |
          echo "${{ secrets.LOCAL_REGISTRY_PASSWORD }}" \
            | skopeo login "${{ vars.LOCAL_REGISTRY }}" \
                -u "${{ secrets.LOCAL_REGISTRY_USER }}" --password-stdin

      - name: Mirror released image ghcr -> local
        run: |
          SRC="${REGISTRY,,}/${IMAGE_NAME,,}"
          DEST="${{ vars.LOCAL_REGISTRY }}/${IMAGE_NAME##*/}"
          TAG="${{ github.event.release.tag_name }}"
          skopeo copy "docker://$SRC:$TAG" "docker://$DEST:$TAG"
          skopeo copy "docker://$SRC:$TAG" "docker://$DEST:latest"
