  #       run: |
  #         echo "${{ secrets.GITHUB_TOKEN }}" \
  #           | skopeo login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

  #     - name: Log in to the local registry
  #       run: |
  #         echo "${{ secrets.LOCAL_REGISTRY_PASSWORD }}" \
  #           | skopeo login "${{ vars.LOCAL_REGISTRY }}" \
  #               -u "${{ secrets.LOCAL_REGISTRY_USER }}" --password-stdin

