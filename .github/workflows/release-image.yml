name: release-image

# Build the Rocky bootc image when a GitHub Release is published, and push it
# to the container registry as a multi-arch (amd64 + arm64) image. The release
# tag becomes the image tag.
on:
  release:
    types: [published]

# Nothing here is hardcoded:
#   REGISTRY    - repo/org Actions *variable* (Settings -> Secrets and variables
#                 -> Actions -> Variables). Defaults to ghcr.io if unset.
#   IMAGE_NAME  - derived from the repo (owner/name), so forks/renames just work.
env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build each architecture natively (no emulation) and push an arch-specific
  # tag. Native arm64 avoids qemu, which the nested rpm-ostree compose does not
  # tolerate well.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Makefile builds and rechunks with `sudo podman`, so the image lives
      # in root's storage. Log in and push as root too, or the image is
      # "not known" to the rootless podman.
      - name: Log in to the container registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" \
            | sudo podman login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and rechunk (${{ matrix.arch }})
        env:
          PLATFORM: ${{ matrix.platform }}
        run: make rechunk PLATFORM="$PLATFORM"

      - name: Push arch-specific tag
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Registry paths must be lowercase; owner/name may contain uppercase.
          IMAGE="${REGISTRY,,}/${IMAGE_NAME,,}"
          sudo podman push rocky-bootc:latest "$IMAGE:$RELEASE_TAG-$ARCH"

  # Stitch the per-arch images into a single multi-arch manifest list, so that
  # `bootc upgrade` on either architecture pulls the right image from one tag.
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      base_ref: ${{ steps.publish.outputs.base_ref }}
    permissions:
      packages: write
    steps:
      - name: Log in to the container registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" \
            | podman login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Assemble and push multi-arch tags
        id: publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="${REGISTRY,,}/${IMAGE_NAME,,}"
          podman manifest create base-image \
            "docker://$IMAGE:$RELEASE_TAG-amd64" \
            "docker://$IMAGE:$RELEASE_TAG-arm64"
          podman manifest push --all base-image "docker://$IMAGE:$RELEASE_TAG"
          podman manifest push --all base-image "docker://$IMAGE:latest"
          echo "base_ref=$IMAGE:$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  # The derived image is a conventional Containerfile build. Docker's reusable
  # builder runs each architecture natively, publishes both tags, and assembles
  # the multi-arch manifest without relying on the runner's Podman or Buildah.
  kubeadm:
    needs: manifest
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1.14.0
    with:
      output: image
      push: true
      context: 10-kubeadm-worker
      file: Containerfile
      platforms: linux/amd64,linux/arm64
      meta-images: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository_owner }}/rocky-kubeadm
      meta-tags: |
        type=raw,value=${{ github.event.release.tag_name }}
        type=raw,value=latest
      build-args: |
        BASE_IMAGE=${{ needs.manifest.outputs.base_ref }}
    secrets:
      registry-auths: |
        - registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Mirror the released image into a local/private registry via a self-hosted
  # runner on your LAN. Disabled until you opt in:
  #   1. Register a self-hosted runner (Settings -> Actions -> Runners) with
  #      skopeo installed.
  #   2. Set variable  ENABLE_LOCAL_MIRROR = true
  #   3. Set variable  LOCAL_REGISTRY      = registry host[:port]
  #   4. Set secrets   LOCAL_REGISTRY_USER / LOCAL_REGISTRY_PASSWORD
  #   5. If the local registry uses a private CA / no TLS, adjust the tls flags.
  # mirror-to-local:
